[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpxkit"
version = "0.1.0"
description = "GPS noise rejection and track-window analytics, with no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "backroadcreativeco@gmail.com" }]
keywords = ["gps", "gpx", "track", "filter", "noise", "outlier", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Back-Road-Creative/gpxkit"
Issues = "https://github.com/Back-Road-Creative/gpxkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gpxkit"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src/gpxkit"]
